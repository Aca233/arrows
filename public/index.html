<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箭有虚发 (Arrows Never Miss)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="ui-container">
        <h1>箭有虚发</h1>
        <div id="score-board"></div>
    </div>
    <div id="game-container" style="display: none;">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- 移动端虚拟摇杆 UI (仅在触屏设备显示) -->
        <div id="touch-controls" style="display: none;">
            <div id="left-stick" class="joystick-zone">
                <div id="left-stick-base" class="stick-base" style="display: none;">
                    <div id="left-stick-knob" class="stick-knob"></div>
                </div>
            </div>
            <div id="right-stick" class="joystick-zone">
                <div id="right-stick-base" class="stick-base" style="display: none;">
                    <div id="right-stick-knob" class="stick-knob"></div>
                </div>
                <!-- 射击/取消技能等附加按钮可放这里 -->
            </div>
        </div>
    </div>

    <!-- 游戏主大厅 -->
    <div id="lobby-panel">
        <h1 style="font-size: 48px; margin-bottom: 5px;">箭有虚发</h1>
        <p style="color: #0ff; margin-top: 0; font-size: 18px; text-shadow: 0 0 10px cyan;">Arrows Never Miss</p>

        <div style="margin: 20px 0;">
            <input type="text" id="player-name-input" placeholder="输入你的代号" maxlength="10">
        </div>

        <div style="margin: 20px 0;">
            <input type="text" id="room-id-input" placeholder="输入房号 (留空随机分配)" maxlength="15"
                style="border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.5); color: #fff; padding: 10px; border-radius: 5px; text-align: center; font-size: 16px;">
        </div>

        <div class="coin-display">
            持有硬币: <span id="coin-count" style="color: gold; text-shadow: 0 0 5px orange;">0</span>
        </div>

        <!-- 局外天赋备选区 -->
        <div id="talent-selection"
            style="margin: 20px 0; max-height: 250px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 10px; background: rgba(0, 0, 0, 0.4);">
            <h3 style="margin-top: 0; color: #aaa; text-align: center; font-size: 16px;">选择出战天赋</h3>
            <button class="talent-btn selected-talent" data-talent="none">无 (标准加成)</button>
            <button class="talent-btn" data-talent="paranoid">偏执 (重弩慢速，未命中不生怪)</button>
            <button class="talent-btn" data-talent="fantasy">幻想 (怪物的形态更加不可捉摸)</button>
            <button class="talent-btn" data-talent="insidious">阴险 (射偏的箭变成隐形地雷)</button>
            <button class="talent-btn" data-talent="clairvoyance">明察 (子弹极快，可按空格广域扫描)</button>
            <button class="talent-btn" data-talent="shield">护盾 (自动生成护盾抵消1次伤害 - 100币)</button>
            <button class="talent-btn" data-talent="poison">毒箭 (使目标中毒持续掉血 - 100币)</button>
            <button class="talent-btn" data-talent="lightning">⚡雷矢 (命中概率触发连锁闪电 - 150币)</button>
        </div>

        <!-- 武器备选区 -->
        <div id="weapon-selection"
            style="margin: 20px 0; max-height: 200px; overflow-y: auto; text-align: left; padding: 10px; border: 1px solid rgba(255, 100, 100, 0.2); border-radius: 10px; background: rgba(0, 0, 0, 0.4);">
            <h3 style="margin-top: 0; color: #aaa; text-align: center; font-size: 16px;">选择装备武器</h3>
            <button class="weapon-btn selected-weapon" data-weapon="bow">普通长弓 (初始)</button>
            <button class="weapon-btn" data-weapon="shortbow">速射短弓 (高射速、低伤害 - 80币)</button>
            <button class="weapon-btn" data-weapon="crossbow">穿透十字弩 (慢蓄力、高伤穿透 - 150币)</button>
            <button class="weapon-btn" data-weapon="dart">散射飞镖 (无蓄力、扇形发射 - 200币)</button>
        </div>

        <!-- Bot 管理区 -->
        <div id="bot-controls"
            style="margin: 15px 0; padding: 10px; border: 1px solid rgba(255, 165, 0, 0.3); border-radius: 10px; background: rgba(0, 0, 0, 0.4);">
            <h3 style="margin-top: 0; color: #ffa500; text-align: center; font-size: 16px;">🤖 AI 对手</h3>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                <button class="menu-btn" style="font-size: 13px; padding: 6px 12px;" onclick="addBot('easy')">+ 简单
                    Bot</button>
                <button class="menu-btn" style="font-size: 13px; padding: 6px 12px;" onclick="addBot('medium')">+ 中等
                    Bot</button>
                <button class="menu-btn" style="font-size: 13px; padding: 6px 12px;" onclick="addBot('hard')">+ 困难
                    Bot</button>
                <button class="menu-btn" style="font-size: 13px; padding: 6px 12px; background: rgba(255,0,0,0.3);"
                    onclick="removeBot()">- 移除 Bot</button>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button class="menu-btn" onclick="joinGame('standard')">标准乱斗</button>
            <button class="menu-btn" onclick="joinGame('dark_forest')">黑暗森林</button>
            <button class="menu-btn" onclick="joinGame('sniper_duel')">狙击对决</button>
        </div>

        <div style="margin-top: 15px;">
            <a href="editor.html" class="menu-btn"
                style="display: inline-block; text-decoration: none; font-size: 13px; padding: 6px 16px; background: rgba(0, 255, 255, 0.1); border: 1px solid rgba(0, 255, 255, 0.25);">📐
                地图编辑器</a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="audio.js"></script>
    <script src="gameLogic.js"></script>
    <script src="client.js"></script>
</body>

</html>
