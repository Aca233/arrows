<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箭有虚发 (Arrows Never Miss)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="ui-container">
        <h1>箭有虚发</h1>
        <div id="score-board"></div>
    </div>
    <div id="game-container" style="display: none;">
        <button id="exit-game-btn" class="menu-btn small-btn danger-btn" onclick="exitGame()"
            style="position: absolute; top: 20px; right: 20px; z-index: 1000;">退出游戏</button>
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- 移动端虚拟摇杆 UI (仅在触屏设备显示) -->
        <div id="touch-controls" style="display: none;">
            <div id="left-stick" class="joystick-zone">
                <div id="left-stick-base" class="stick-base" style="display: none;">
                    <div id="left-stick-knob" class="stick-knob"></div>
                </div>
            </div>
            <div id="right-stick" class="joystick-zone">
                <div id="right-stick-base" class="stick-base" style="display: none;">
                    <div id="right-stick-knob" class="stick-knob"></div>
                </div>
                <!-- 射击/取消技能等附加按钮可放这里 -->
            </div>
        </div>
    </div>

    <!-- 游戏主大厅 -->
    <div id="lobby-panel">
        <h1 style="font-size: 48px; margin-bottom: 5px;">箭有虚发</h1>
        <p style="color: #0ff; margin-top: 0; font-size: 18px; text-shadow: 0 0 10px cyan; letter-spacing: 2px;">Arrows
            Never Miss</p>

        <div id="lobby-content">
            <!-- 左栏：玩家与房间设置 -->
            <div class="lobby-column">
                <h2 class="column-title">🎮 游戏房间</h2>

                <!-- 加入房间操作区 (未进入房间时显示) -->
                <div id="room-join-section">
                    <div class="input-group">
                        <input type="text" id="player-name-input" placeholder="输入代号" maxlength="10">
                        <input type="text" id="room-id-input" placeholder="输入房号" maxlength="15">
                    </div>
                    <div class="btn-group" style="margin-bottom: 20px;">
                        <button class="menu-btn small-btn" onclick="openRoomBrowser()">🌍 浏览房间</button>
                        <button class="menu-btn small-btn" onclick="createRoom()">新建/加入</button>
                    </div>
                </div>

                <!-- 房间准备区 (已加入房间时显示) -->
                <div id="room-staging" class="panel-section room-section" style="display: none;">
                    <div class="section-header">
                        <h3>🏠 房间状态</h3>
                        <div class="btn-group">
                            <button class="menu-btn small-btn danger-btn" onclick="leaveRoom()">退出房间</button>
                        </div>
                    </div>

                    <div class="status-board">
                        <div class="status-row"><span>房号:</span> <strong id="lobby-room-id">未创建</strong></div>
                        <div class="status-row"><span>模式:</span> <strong id="lobby-room-mode">standard</strong></div>
                        <div class="status-row"><span>地图:</span> <strong id="lobby-room-map">standard</strong></div>
                        <div class="status-row"><span>状态:</span> <strong id="lobby-room-state">等待中</strong></div>
                        <div class="status-row"><span>人数:</span> <strong id="lobby-player-count">0</strong></div>
                    </div>

                    <div class="section-label">房间成员</div>
                    <div id="lobby-players-list"
                        style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:15px; min-height:30px; background:rgba(0,0,0,0.3); padding:10px; border-radius:4px;">
                        <span style="color:#aaa; font-size:14px;">等待...</span>
                    </div>

                    <div class="section-label">选择模式</div>
                    <div class="btn-group">
                        <button class="menu-btn mode-btn" onclick="setRoomMode('standard')">标准乱斗</button>
                        <button class="menu-btn mode-btn" onclick="setRoomMode('sniper_duel')">狙击对决</button>
                    </div>

                    <div class="section-label">选择地图</div>
                    <div class="btn-group" id="map-selection-list" style="flex-wrap: wrap;">
                        <button class="menu-btn mode-btn" onclick="setRoomMap('standard')">标准</button>
                        <button class="menu-btn mode-btn" onclick="setRoomMap('dark_forest')">暗林</button>
                    </div>
                </div>

                <!-- Bot 管理区 -->
                <div id="bot-controls" class="panel-section bot-section" style="display: none;">
                    <h3>🤖 AI 对手</h3>
                    <div class="bot-grid">
                        <button class="menu-btn small-btn" onclick="addBot('easy')">+ 简单</button>
                        <button class="menu-btn small-btn" onclick="addBot('medium')">+ 中等</button>
                        <button class="menu-btn small-btn" onclick="addBot('hard')">+ 困难</button>
                        <button class="menu-btn small-btn danger-btn" onclick="removeBot()">- 移除</button>
                    </div>
                </div>
            </div>

            <!-- 右栏：战备选择 -->
            <div class="lobby-column">
                <div class="loadout-header">
                    <h2 class="column-title" style="border: none; padding: 0;">⚔️ 战备物资</h2>
                    <div class="coin-display">
                        便携硬币: <span id="coin-count">0</span>
                    </div>
                </div>

                <!-- 武器备选区 -->
                <div id="weapon-selection" class="panel-section weapon-section scrollable-list">
                    <h3>选择武器</h3>
                    <button class="weapon-btn selected-weapon" data-weapon="bow">普通长弓 (初始)</button>
                    <button class="weapon-btn" data-weapon="shortbow">速射短弓 (速射、低伤 - 80币)</button>
                    <button class="weapon-btn" data-weapon="crossbow">穿透十字弩 (慢蓄、穿透 - 150币)</button>
                    <button class="weapon-btn" data-weapon="dart">散射飞镖 (无蓄、扇形 - 200币)</button>
                </div>

                <!-- 局外天赋备选区 -->
                <div id="talent-selection" class="panel-section talent-section scrollable-list">
                    <h3>选择天赋</h3>
                    <button class="talent-btn selected-talent" data-talent="none">无 (标准加成)</button>
                    <button class="talent-btn" data-talent="paranoid">偏执 (重弩慢速，未命中不生怪)</button>
                    <button class="talent-btn" data-talent="fantasy">幻想 (怪物的形态更加不可捉摸)</button>
                    <button class="talent-btn" data-talent="insidious">阴险 (射偏的箭变成隐形地雷)</button>
                    <button class="talent-btn" data-talent="clairvoyance">明察 (子弹极快，可按空格广域扫描)</button>
                    <button class="talent-btn" data-talent="shield">护盾 (自动生成护盾 - 100币)</button>
                    <button class="talent-btn" data-talent="poison">毒箭 (目标中毒掉血 - 100币)</button>
                    <button class="talent-btn" data-talent="lightning">⚡雷矢 (命中概率发连锁闪电 - 150币)</button>
                </div>
            </div>
        </div>

        <!-- 底部按钮区 -->
        <div class="lobby-footer">
            <a href="editor.html" class="menu-btn secondary-btn">
                📐 地图编辑器
            </a>
            <button id="start-game-btn" class="menu-btn primary-btn" onclick="startGame()" style="display: none;">
                🚀 开始游戏
            </button>
        </div>

        <!-- 房间浏览器模态框 -->
        <div id="room-browser-modal" style="display: none;">
            <div class="browser-content">
                <div class="browser-header">
                    <h2>🌍 活跃房间大厅</h2>
                    <button class="menu-btn small-btn danger-btn" onclick="closeRoomBrowser()">关闭 ✖</button>
                </div>
                <div class="browser-controls">
                    <button class="menu-btn small-btn" onclick="refreshRoomList()">🔄 刷新列表</button>
                </div>
                <div id="room-list-container" class="scrollable-list">
                    <!-- 房间列表动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="audio.js"></script>
    <script src="gameLogic.js"></script>
    <script src="client.js"></script>
</body>

</html>
